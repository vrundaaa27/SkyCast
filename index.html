<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyCast - Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>SkyCast</h1>

        <p>Check the weather of any city</p>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search</button>

        </div>

        <button id="locationBtn">
            📍 Use My Location
        </button>

        <div class="weather-info">

            <h2 id="cityName">City Name</h2>

            <div id="weatherIcon">🌤️</div>

            <h3 id="temperature">--°C</h3>

            <p id="feelsLike">Feels like: --°C</p>

            <p id="condition">Weather condition</p>

            <div class="details">

                <p>
                    💧 Humidity:
                    <span id="humidity">--</span>%
                </p>

                <p>
                    💨 Wind Speed:
                    <span id="windSpeed">--</span> km/h
                </p>

            </div>

        </div>

        <p id="errorMessage"></p>

        <p id="loadingMessage"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
